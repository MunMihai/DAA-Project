apiVersion: v1
kind: Service
metadata:
  name: authservice
spec:
  selector:
    app.kubernetes.io/name: authservice
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authservice
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mongo 27017; do echo waiting for mongo; sleep 2; done
      containers:
        - name: authservice
          image: registry.digitalocean.com/placeholder/authservice:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__quizauthdb
              valueFrom:
                secretKeyRef:
                  name: quiz-secrets
                  key: mongodb-auth-uri
            - name: Jwt__Issuer
              value: QuizArena.Identity
            - name: Jwt__Audience
              value: QuizArena.Web
            - name: Jwt__ExpiresMinutes
              value: "600"
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: quiz-secrets
                  key: jwt-signing-key
            - name: Seed__Enabled
              value: "true"
            - name: Seed__Token
              valueFrom:
                secretKeyRef:
                  name: quiz-secrets
                  key: seed-api-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
