              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ReverseProxy__Clusters__identity-cluster__Destinations__identity__Address
              value: http://authservice:8080/
            - name: ReverseProxy__Clusters__quiz-cluster__Destinations__quiz__Address
              value: http://quizservice:8080/
            - name: ReverseProxy__Clusters__live-cluster__Destinations__live__Address
              value: http://livesessionservice:8080/
            - name: ReverseProxy__Clusters__coding-quiz-cluster__Destinations__coding-quiz__Address
