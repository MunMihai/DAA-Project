apiVersion: v1
kind: Service
metadata:
  name: apigateway
spec:
  selector:
    app.kubernetes.io/name: apigateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apigateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apigateway
    spec:
      initContainers:
        - name: wait-for-authservice
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z authservice 8080; do echo waiting for authservice; sleep 2; done
        - name: wait-for-quizservice
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z quizservice 8080; do echo waiting for quizservice; sleep 2; done
        - name: wait-for-livesessionservice
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z livesessionservice 8080; do echo waiting for livesessionservice; sleep 2; done
        - name: wait-for-codingservice
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z codingservice 8080; do echo waiting for codingservice; sleep 2; done
      containers:
        - name: apigateway
          image: registry.digitalocean.com/placeholder/apigateway:latest
