name: CD

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: Run the seed job after deployment
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - master

env:
  DOKS_CLUSTER_NAME: k8s-1-35-1-do-0-fra1-1774185110679
  DOCR_REGISTRY_NAME: dev-docker-registry
  K8S_NAMESPACE: quiz-platform

jobs:
  package:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Quiz.Web/app/package-lock.json

      - name: Build deployable artifacts
        run: bash ./scripts/build-artifacts.sh

      - name: Upload deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifacts
          path: .artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download deploy artifacts
        uses: actions/download-artifact@v5
        with:
          name: deploy-artifacts
          path: .artifacts

      - name: Validate deploy secrets
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          SEED_API_TOKEN: ${{ secrets.SEED_API_TOKEN }}
        run: |
          missing=0
          for secret_name in \
            DIGITALOCEAN_ACCESS_TOKEN \
            JWT_SIGNING_KEY \
            GROQ_API_KEY \
            MONGO_ROOT_PASSWORD \
            REDIS_PASSWORD \
            RABBITMQ_PASSWORD \
            RABBITMQ_ERLANG_COOKIE \
            SEED_API_TOKEN
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing GitHub secret: ${secret_name}"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Install doctl
        run: |
          DOCTL_VERSION="1.152.0"
          curl -fsSL "https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}/doctl-${DOCTL_VERSION}-linux-amd64.tar.gz" \
            | tar -xz
          sudo mv doctl /usr/local/bin/doctl
          doctl version

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to DigitalOcean Kubernetes
        run: bash ./scripts/deploy/doks-deploy.sh
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          SEED_API_TOKEN: ${{ secrets.SEED_API_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          SKIP_LOCAL_BUILD: "1"
          RUN_SEED_AFTER_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_seed == 'true' && '1' || '0' }}
